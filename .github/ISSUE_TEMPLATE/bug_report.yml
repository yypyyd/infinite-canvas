name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: 问题描述
      description: 请说明实际结果和期望结果。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    attributes:
      label: 版本与部署方式
      placeholder: v0.2.13 / Docker / 源码运行
    validations:
      required: true
  - type: textarea
    attributes:
      label: 补充信息
      description: 可提供已脱敏的日志、截图和环境信息，请勿提交密钥或用户数据。
