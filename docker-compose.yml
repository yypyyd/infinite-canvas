services:
  app:
    image: ${INFINITE_CANVAS_IMAGE:-infinite-canvas:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DOC_URL: ${NEXT_PUBLIC_DOC_URL:-https://docs.canvas.best}
        NEXT_PUBLIC_REPOSITORY_URL: ${NEXT_PUBLIC_REPOSITORY_URL:-https://github.com/yypyyd/infinite-canvas}
        NEXT_PUBLIC_VERSION_URL: ${NEXT_PUBLIC_VERSION_URL:-https://raw.githubusercontent.com/yypyyd/infinite-canvas/main/VERSION}
    container_name: infinite-canvas
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    restart: unless-stopped
  batch-worker:
    image: ${INFINITE_CANVAS_IMAGE:-infinite-canvas:local}
    profiles: ["worker"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["/app/batch-worker"]
    restart: unless-stopped
  # 可选：幻图与内置账号池共用的 PostgreSQL，使用 `--profile postgres` 启用，
  # 并在 .env 设置 STORAGE_DRIVER=postgres、DATABASE_DSN=postgres://huantu:<POSTGRES_PASSWORD>@postgres:5432/huantu?sslmode=disable。
  # 不启用时（默认 SQLite），镜像内会自动为账号池启动嵌入式 PostgreSQL，无需额外服务。
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huantu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-huantu}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  # 可选：多个幻图实例共享账号池时才需要 Redis（`--profile redis`，并设置 POOL_REDIS_ADDR=redis:6379）。
  # 单实例无需 Redis：并发闸门、轮询游标与配置缓存在进程内完成。
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${POOL_REDIS_PASSWORD:-}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$POOL_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      POOL_REDIS_PASSWORD: ${POOL_REDIS_PASSWORD:-}
    restart: unless-stopped
  # 可选：账号池生成图片对象存储（RustFS / S3 兼容），使用 `--profile pool-storage` 启用
  pool-rustfs:
    image: rustfs/rustfs:latest
    profiles: ["pool-storage"]
    environment:
      RUSTFS_ACCESS_KEY: ${POOL_RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${POOL_RUSTFS_SECRET_KEY:-}
    volumes:
      - pool-rustfs-data:/data
    restart: unless-stopped
  pool-createbucket:
    image: ${INFINITE_CANVAS_IMAGE:-infinite-canvas:local}
    profiles: ["pool-storage"]
    depends_on: [pool-rustfs]
    environment:
      RUSTFS_ENDPOINT: ${POOL_RUSTFS_ENDPOINT:-http://pool-rustfs:9000}
      RUSTFS_BUCKET: ${POOL_RUSTFS_BUCKET:-generated}
      RUSTFS_ACCESS_KEY: ${POOL_RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${POOL_RUSTFS_SECRET_KEY:-}
    command: ["/app/gateway-init-bucket"]
    restart: "no"
volumes:
  postgres-data:
  redis-data:
  pool-rustfs-data:
