name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 已有镜像标签，例如 v0.2.18 或 latest。只部署、不构建。
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Deploy production container
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TAG: ${{ github.event.inputs.image_tag || github.ref_name }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY"
          test -n "$TAG"
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          python3 - <<'PY'
          import os
          from pathlib import Path

          def sh_quote(value: str) -> str:
              return "'" + value.replace("'", "'\"'\"'") + "'"

          Path("/tmp/infinite-canvas-deploy.env").write_text(
              "".join(
                  f"{key}={sh_quote(os.environ.get(key, ''))}\n"
                  for key in ("TAG", "GHCR_USERNAME", "GHCR_READ_TOKEN")
              ),
              encoding="utf-8",
          )
          PY
          scp scripts/deploy-production.sh /tmp/infinite-canvas-deploy.env "$USER@$HOST:/tmp/"
          ssh "$USER@$HOST" 'install -d -m 755 /opt/infinite-canvas && install -m 755 /tmp/deploy-production.sh /opt/infinite-canvas/deploy-production.sh && set -a && . /tmp/infinite-canvas-deploy.env && rm -f /tmp/infinite-canvas-deploy.env && /opt/infinite-canvas/deploy-production.sh'
