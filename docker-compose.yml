services:
  app:
    image: ghcr.io/basketikun/infinite-canvas:latest
    container_name: infinite-canvas
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped
  batch-worker:
    image: ghcr.io/basketikun/infinite-canvas:latest
    profiles: ["worker"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["/app/batch-worker"]
    restart: unless-stopped
