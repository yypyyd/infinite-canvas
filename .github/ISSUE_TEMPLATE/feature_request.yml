name: 功能建议
description: 提议新的使用场景或改进方向
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: 使用场景
      description: 请先说明要解决的问题，而不只是描述按钮或实现。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    attributes:
      label: 其他方案
      description: 如果尝试过替代方案，请一并说明。
